services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-tekser}
      POSTGRES_USER: ${DB_USER:-tekser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-tekser}
    # Host port is customizable via .env (DB_PORT) so it never clashes with a
    # PostgreSQL already running on the host. Inside the compose network the
    # app always reaches it on the fixed internal 5432.
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-tekser} -d ${DB_NAME:-tekser}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Builds and tags the per-student exam sandbox image as a normal part of
  # `docker compose up --build`. It has nothing to actually run — it exits
  # right after build — so "forgot to build the sandbox image" (the #1 cause
  # of "container belum siap") can't happen anymore on a fresh checkout.
  sandbox-image:
    build:
      context: ./docker
      dockerfile: Dockerfile.sandbox
    image: ${SANDBOX_IMAGE:-tekser-sandbox:latest}
    command: ["true"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:-change-this-to-a-long-random-string}
      DATABASE_URL: postgres://${DB_USER:-tekser}:${DB_PASSWORD:-tekser}@db:5432/${DB_NAME:-tekser}
      CONTAINER_DRIVER: ${CONTAINER_DRIVER:-mock}
      SANDBOX_IMAGE: ${SANDBOX_IMAGE:-tekser-sandbox:latest}
      SANDBOX_NETWORK: ${SANDBOX_NETWORK:-tekser-sandbox-net}
      CONTAINER_MEMORY_MB: ${CONTAINER_MEMORY_MB:-128}
      CONTAINER_CPUS: ${CONTAINER_CPUS:-0.5}
      CONTAINER_PIDS_LIMIT: ${CONTAINER_PIDS_LIMIT:-64}
      # Sandbox containers reach the app by its compose service name over the
      # dedicated internal network below — no host.docker.internal needed.
      CMD_LOG_CALLBACK_URL: ${CMD_LOG_CALLBACK_URL:-http://app:3000/api/cmd-log}
      DEFAULT_SESSION_DURATION_MINUTES: ${DEFAULT_SESSION_DURATION_MINUTES:-10}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      # Telegram bot: compose reads the root .env for these; unset => bot runs in
      # disabled/mock mode (no long-polling, link-code returns null botUsername).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      OTP_TTL_MINUTES: ${OTP_TTL_MINUTES:-10}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy
      sandbox-image:
        condition: service_completed_successfully
    # CONTAINER_DRIVER=docker spawns sibling sandbox containers on the host
    # daemon; needs the socket to create/exec/destroy them, and must sit on
    # tekser-sandbox-net (below) so those containers can call back to it.
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - default            # reaches `db` (compose's implicit network)
      - tekser-sandbox-net  # reachable by every spawned sandbox container as "app"
    # dockerode talks to the bind-mounted socket (root:docker, mode 660). The
    # app image has no USER line so it already runs as root — explicit here so
    # a future base-image change can't silently break socket access. If you add
    # a non-root USER, drop this and instead: group_add: ["<host docker gid>"].
    user: root

volumes:
  pgdata:

networks:
  # Sandbox (student) containers join this network instead of running with
  # no network at all. `internal: true` means Docker gives it no route to
  # the outside world — students still can't reach the internet — but
  # containers on it CAN resolve and reach each other, so the sandbox's
  # command-log webhook calls to the `app` service work. This replaces the
  # old NetworkMode: 'none', which blocked internet access AND the callback
  # the whole grading pipeline depends on (see containerDrivers.js).
  tekser-sandbox-net:
    name: tekser-sandbox-net
    driver: bridge
    internal: true
