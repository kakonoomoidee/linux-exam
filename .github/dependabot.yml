version: 2
updates:
  # App dependencies live in server/, not the repo root.
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One PR a week for all non-major bumps; majors still come individually.
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  # Base image in server/Dockerfile (node:20-bookworm-slim).
  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore

  # Base image in docker/Dockerfile.sandbox (ubuntu:22.04).
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore

  # Keep the action versions in .github/workflows/ current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: ci
